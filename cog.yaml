# Cog build configuration for the Ideogram 4 trainer
build:
  gpu: true
  cuda: "12.8"
  python_version: "3.12"
  system_packages:
    - git
  run:
    - rm -rf SimpleTuner && git clone --depth 1 --branch main https://github.com/bghira/SimpleTuner.git SimpleTuner
    - pip install --upgrade pip
    - printf '%s\n' 'torch==2.10.0+cu128' 'torchvision==0.25.0+cu128' 'torchaudio==2.10.0+cu128' > /tmp/constraints-cuda128.txt
    - pip install --no-deps --index-url https://download.pytorch.org/whl/cu128 -c /tmp/constraints-cuda128.txt torch torchvision torchaudio
    - 'SITE=$(python -c "import site; print(site.getsitepackages()[0])"); for spec in nvidia-cuda-nvrtc-cu12==12.8.93 nvidia-cuda-runtime-cu12==12.8.90 nvidia-cuda-cupti-cu12==12.8.90 nvidia-cudnn-cu12==9.10.2.21 nvidia-cublas-cu12==12.8.4.1 nvidia-cufft-cu12==11.3.3.83 nvidia-curand-cu12==10.3.9.90 nvidia-cusolver-cu12==11.7.3.90 nvidia-cusparse-cu12==12.5.8.93 nvidia-cusparselt-cu12==0.7.1 nvidia-nccl-cu12==2.27.5 nvidia-nvshmem-cu12==3.3.20 nvidia-nvtx-cu12==12.8.90 nvidia-nvjitlink-cu12==12.8.93 nvidia-cufile-cu12==1.13.1.3; do name=${spec%%==*}; version=${spec##*==}; normalized=$(printf "%s" "$name" | tr - _); dist="$SITE/${normalized}-${version}.dist-info"; mkdir -p "$dist"; printf "Metadata-Version: 2.1\nName: %s\nVersion: %s\n" "$name" "$version" > "$dist/METADATA"; printf "Wheel-Version: 1.0\nGenerator: cog-local-cuda-runtime-stub\nRoot-Is-Purelib: false\nTag: py3-none-any\n" > "$dist/WHEEL"; printf "cog-local-stub\n" > "$dist/INSTALLER"; : > "$dist/RECORD"; done'
    - pip install --force-reinstall --no-deps nvidia-cusparselt-cu12==0.7.1 nvidia-nccl-cu12==2.27.5
    - 'SITE=$(python -c "import site; print(site.getsitepackages()[0])"); printf "%s\n%s\n" "$SITE/nvidia/cusparselt/lib" "$SITE/nvidia/nccl/lib" > /etc/ld.so.conf.d/nvidia-cuda-python-wheels.conf; ldconfig; python -c "import ctypes; ctypes.CDLL(\"libcusparseLt.so.0\"); ctypes.CDLL(\"libnccl.so.2\")"'
    - pip install --extra-index-url https://download.pytorch.org/whl/cu128 -c /tmp/constraints-cuda128.txt -e ./SimpleTuner
    - pip install --extra-index-url https://download.pytorch.org/whl/cu128 -c /tmp/constraints-cuda128.txt "triton>=3.3.0" "bitsandbytes>=0.45.0" "deepspeed>=0.17.2" "torchao>=0.14.0,<0.16.0" "kernels==0.11.1" "nvidia-ml-py>=12.555" "lm-eval>=0.4.4" ramtorch
    - python -c "from huggingface_hub import snapshot_download; models={'hf_falconsai':'Falconsai/nsfw_image_detection','hf_adamcodd':'AdamCodd/vit-base-nsfw-detector','hf_hoangtrung':'hoangtrung1801/nsfw-vit-model'}; [snapshot_download(repo_id=repo, allow_patterns=['*.json','*.safetensors','*.bin','*.txt'], local_dir=f'/opt/nsfw-classifier-comparison/{key}') for key, repo in models.items()]"
    - 'python -c "import json,pathlib; root=pathlib.Path(''/opt/nsfw-classifier-comparison''); [(d/''preprocessor_config.json'').write_text(json.dumps(dict(do_normalize=True, do_rescale=True, do_resize=True, image_mean=[0.5,0.5,0.5], image_processor_type=''ViTImageProcessor'', image_std=[0.5,0.5,0.5], resample=2, rescale_factor=0.00392156862745098, size=dict(height=int(c.get(''image_size'',224)), width=int(c.get(''image_size'',224)))), indent=2), encoding=''utf-8'') for d in root.iterdir() if d.is_dir() and (d/''config.json'').is_file() and not (d/''preprocessor_config.json'').is_file() for c in [json.loads((d/''config.json'').read_text(encoding=''utf-8''))] if c.get(''model_type'') == ''vit'']"'

predict: "predict.py:Predictor"
